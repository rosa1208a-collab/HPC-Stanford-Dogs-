apiVersion: batch/v1
kind: Job
metadata:
  name: bordes-prueba
spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: bordes-prueba

    spec:
      restartPolicy: Never

      containers:
        - name: worker
          image: bordes:1.0
          imagePullPolicy: IfNotPresent

          env:
            - name: TOTAL_TASKS
              value: "8"

            - name: DATA_DIR
              value: /data/entrada/prueba400

            - name: OUTPUT_DIR
              value: /data/salida/prueba400

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          volumeMounts:
            - name: datos
              mountPath: /data

      volumes:
        - name: datos
          hostPath:
            path: /data
            type: Directory
